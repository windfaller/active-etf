name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_COAST_08B07E900 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "/" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          app_build_command: "npm run build"
          api_build_command: "npm run functions:build"
          ###### End of Repository/Build Configurations ######

      - name: Ensure P1 production indexes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ADMIN_JOB_TOKEN: ${{ secrets.ADMIN_JOB_TOKEN }}
          STATIC_WEB_APP_URL: ${{ steps.builddeploy.outputs.static_web_app_url }}
        run: |
          test -n "$ADMIN_JOB_TOKEN"
          test -n "$STATIC_WEB_APP_URL"
          curl --fail-with-body --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors --connect-timeout 10 --max-time 60 \
            --request POST \
            --header "x-admin-token: $ADMIN_JOB_TOKEN" \
            "${STATIC_WEB_APP_URL%/}/api/jobs/indexes/ensure"

      - name: Smoke test Azure production origin
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BASE_URL: ${{ steps.builddeploy.outputs.static_web_app_url }}
          EXPECTED_VERSION: ${{ github.sha }}
          INDEXES_ENSURED: "true"
        run: node scripts/production-smoke.mjs

      - name: Smoke test custom domain and legacy redirect
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BASE_URL: https://active-etf.inthewins.com
          EXPECTED_VERSION: ${{ github.sha }}
          INDEXES_ENSURED: "true"
          CHECK_LEGACY_REDIRECT: "true"
        run: node scripts/production-smoke.mjs

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_COAST_08B07E900 }}
          action: "close"
